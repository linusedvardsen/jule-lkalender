<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juleølkalender</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2419'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c93b47' stroke-width='1.5'/%3E%3Cpath d='M16 5l2.7 6.5 7 .6-5.3 4.6 1.6 6.8-6-3.7-6 3.7 1.6-6.8-5.3-4.6 7-.6z' fill='%23f0c46b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div id="snowfall" class="snowfall" aria-hidden="true"></div>

  <div class="garland" aria-hidden="true">
    <svg class="garland__svg" viewBox="0 0 1200 54" preserveAspectRatio="xMidYMin slice">
      <path class="garland__wire" d="M0,10 Q100,34 200,12 T400,14 T600,12 T800,14 T1000,12 T1200,10" />
      <g class="garland__bulb garland__bulb--gold" transform="translate(80 22)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--red" transform="translate(180 14)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--green" transform="translate(290 8)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--gold" transform="translate(400 15)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--red" transform="translate(510 19)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--green" transform="translate(620 12)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--gold" transform="translate(730 9)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--red" transform="translate(840 17)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--green" transform="translate(950 16)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--gold" transform="translate(1060 9)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
      <g class="garland__bulb garland__bulb--red" transform="translate(1150 13)">
        <rect x="-3" y="-6" width="6" height="5" rx="1" class="garland__cap" />
        <ellipse cx="0" cy="6" rx="5.5" ry="8" />
      </g>
    </svg>
  </div>

  <div class="page-shell">
    <header class="site-header">
      <div class="site-crest" aria-hidden="true">
        <svg class="site-crest__svg" viewBox="0 0 120 44" width="120" height="44">
          <path d="M46 28 C34 28, 25 22, 18 14 C27 12, 37 15, 45 23 Z" fill="#1f6b4a" />
          <path d="M44 29 C31 32, 21 30, 12 25 C21 20, 32 21, 44 26 Z" fill="#175238" />
          <path d="M74 28 C86 28, 95 22, 102 14 C93 12, 83 15, 75 23 Z" fill="#1f6b4a" />
          <path d="M76 29 C89 32, 99 30, 108 25 C99 20, 88 21, 76 26 Z" fill="#175238" />
          <path d="M60 4 L63.5 14 L74 14.8 L66 21.6 L68.5 32 L60 26.2 L51.5 32 L54 21.6 L46 14.8 L56.5 14 Z" fill="#f0c46b" />
          <circle cx="53" cy="30" r="3.6" fill="#c93b47" />
          <circle cx="67" cy="30" r="3.6" fill="#c93b47" />
          <circle cx="60" cy="34" r="4" fill="#e04f5c" />
        </svg>
      </div>
      <p class="site-eyebrow">1. &ndash; 24. desember</p>
      <h1 id="calendar-title" class="site-title">Juleølkalender</h1>
      <p id="calendar-subtitle" class="site-subtitle">Én ny juleøl bak hver luke frem mot jul &ndash; ny luke åpnes kl. 06:00 hver dag!</p>
      <p id="demo-banner" class="demo-banner" hidden></p>
    </header>

    <main class="calendar-main">
      <p id="calendar-status" class="calendar-status" role="status" aria-live="polite" hidden></p>
      <section id="calendar-grid" class="calendar-grid" aria-label="Luker i juleølkalenderen"></section>
    </main>

    <footer class="site-footer">
      <p>God jul og skål &bull; Juleølkalender</p>
    </footer>
  </div>

  <dialog id="video-modal" class="video-modal" aria-labelledby="modal-title">
    <div class="video-modal__ribbon" aria-hidden="true"></div>
    <div class="video-modal__surface">
      <header class="video-modal__header">
        <h2 id="modal-title" class="video-modal__title">Luke 1</h2>
        <button type="button" id="modal-close" class="video-modal__close" aria-label="Lukk videovindu">&times;</button>
      </header>

      <div class="video-modal__body">
        <iframe
          id="door-youtube"
          class="video-modal__player"
          title="Videospiller for juleølkalender"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
          hidden
        ></iframe>
        <p id="modal-message" class="video-modal__message" hidden></p>
      </div>
    </div>
  </dialog>
</body>
</html>

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Zero-copy static and media delivery
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Basic flood and Slowloris protection for direct public IP exposure
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_status 429;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Compress text-based assets only; video formats remain uncompressed for byte-range seeking
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        limit_req zone=general burst=40 nodelay;
        limit_conn addr 20;

        # Standard security headers (defined at server level; locations use `expires`, not `add_header`, so inheritance stays intact)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Required by YouTube embeds (youtube-nocookie.com) to avoid Error 153
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Internal healthcheck endpoint used by Docker Compose
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Server-gated calendar API (strips locked video URLs until 06:00 Oslo time)
        location = /api/calendar {
            proxy_pass http://api:3000/api/calendar;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-store, max-age=0" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Block hidden files such as .gitkeep
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # MP4/WebM streaming: natively advertises Accept-Ranges: bytes and serves 206 Partial Content
        location ~* \.(?:mp4|webm|m4v|ogv)$ {
            gzip off;
            sendfile on;
            sendfile_max_chunk 2m;
            tcp_nopush on;
            tcp_nodelay on;
            expires 30d;
        }

        # Static frontend assets
        location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
            expires 7d;
        }

        # HTML and calendar manifest: always revalidate so door updates appear promptly
        location ~* \.(?:html|json)$ {
            expires -1;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

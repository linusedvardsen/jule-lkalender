services:
  api:
    image: node:22-alpine
    restart: unless-stopped
    user: "node"
    command: ["node", "/app/server.js"]
    environment:
      PORT: "3000"
      DATA_DIR: "/app/data"
      TZ_NAME: "Europe/Oslo"
    expose:
      - "3000"
    volumes:
      - ./api:/app:ro
      - ./data:/app/data:ro
    networks:
      - advent-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - advent-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  advent-internal:
    driver: bridge

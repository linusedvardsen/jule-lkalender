# Local preview Compose file — publishes port 8080 without Cloudflare Tunnel.
# For production behind Cloudflare Tunnel, use docker-compose.yml instead.
services:
  web:
    image: nginx:alpine
    restart: "no"
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3s
